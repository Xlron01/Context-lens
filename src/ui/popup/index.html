<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 320px; padding: 12px; color: #222; }
      h2 { font-size: 15px; margin: 0 0 10px; }
      label { display: block; margin: 8px 0 3px; font-weight: 600; font-size: 12px; }
      input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; padding: 5px 6px; }
      .hint { font-size: 11px; color: #666; margin: 2px 0 6px; }
      .status { margin-top: 10px; font-size: 12px; }
      .ok { color: #1a7f37; } .err { color: #b35900; }
      button { margin-top: 10px; padding: 5px 12px; }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h2>Context Lens</h2>
    <label for="gemini">Gemini API key</label>
    <div class="hint">Free tier: aistudio.google.com → Get API key</div>
    <input type="password" id="gemini" placeholder="AIza…" />

    <label for="groq">Groq API key (optional)</label>
    <div class="hint">Free: console.groq.com</div>
    <input type="password" id="groq" />

    <label for="nvidia">NVIDIA API key (optional)</label>
    <div class="hint">Free: build.nvidia.com</div>
    <input type="password" id="nvidia" />

    <label for="openrouter">OpenRouter API key (optional)</label>
    <div class="hint">Has free models: openrouter.ai</div>
    <input type="password" id="openrouter" />

    <div class="row">
      <input type="checkbox" id="redact" />
      <label for="redact" style="margin:0; font-weight:400">Redact author handles before sending</label>
    </div>

    <button id="save">Save</button>
    <div class="status" id="status"></div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
